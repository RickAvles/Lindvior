spring:
  application:
    name: Lindvior

  profiles:
    active: dev

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - beans
          - conditions

  endpoint:
    health:
      show-details: always

jwt:
  secret-key: LindviorSecretSmartParkingPlatformDevelopment2026JWT
  expiration: 86400000

application:
  version: 1.0.0
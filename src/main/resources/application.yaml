spring:
  application:
    name: Smart parking Platform

  datasource:
    url: jdbc:postgresql://localhost:5432/smartparking
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

application:
  version: 1.0.0
  environment: development
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartparking
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: ERROR

application:
  environment: development

